[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "civitapy"
version = "0.1.2"
description = "Python bindings for the CivitAI Site API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/civitapy"]

[tool.ruff]
line-length = 120
target-version = "py310"
